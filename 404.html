<!DOCTYPE html>

<head>
  <!-- ══════════════════════════════════════════════════════════════
       404.html — GitHub Pages fallback (served for ANY unmatched URL,
       at any depth, with HTTP 404 — https://docs.github.com/pages).

       Why this exists: /product/{slug}/ and /books/{slug}/ are static
       files written by scripts/generate-product-pages.js, run either
       on-demand (Supabase Edge Function → GitHub Actions workflow_dispatch,
       fired right after an admin save) or by a 2-hour cron safety net.
       Both paths can leave a real, active product without its static
       page for a while: the on-demand trigger is deliberately
       best-effort/non-fatal (see triggerPageRebuild() in
       admin/products-manager.js — a dispatch failure must never block
       the admin's save) and the cron only closes the gap every 2h.
       GitHub Pages is pure static hosting with no server-side routing,
       so a slug that has no committed index.html yet 404s for every
       visitor until the next successful generation run.

       This page closes that gap generically, for every product/book,
       forever — not just the ones broken today: if the requested path
       looks like /product/{slug}/ or /books/{slug}/, it fetches that
       slug straight from Supabase client-side and renders it with the
       exact same code the pre-rendered pages use to hydrate themselves
       (js/product-page.js + js/product-template.js + js/book-template.js,
       driven by window.PRODUCT_SLUG — mirrors how the old dynamic
       /product/index.html?slug=X page worked before static generation
       existed). The URL bar keeps the real URL the visitor followed
       (GitHub Pages serves this file's content AT that URL), so once
       the real static page lands, the exact same link starts serving
       it directly with zero visitor-facing change.

       Anything that isn't a product/book URL (typo, old bookmark, etc.)
       gets a plain "page not found" message instead — no point paying
       for a Supabase round trip on a link that was never going to
       resolve to a product.
       ══════════════════════════════════════════════════════════════ -->

  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N4NME3KN9N');</script>

<script>
(function () {
  /* Only /product/{slug}/ and /books/{slug}/ are ever generated as
     static pages — anything else hitting this file is a genuine
     dead link (typo, stale bookmark, removed page), not a
     generation-gap product. Keep the two cases visually distinct
     instead of showing a "product not found" message for a URL
     that was never a product. */
  var m = window.location.pathname.match(/^\/(product|books)\/([^/]+)\/?$/i);
  if (!m) {
    document.getElementById('pdContent').innerHTML =
      '<div class="pd-error">' +
        '<h2>⚠️ الصفحة غير موجودة</h2>' +
        '<p>الرابط الذي طلبته غير موجود. تحقق من الرابط أو عد للرئيسية.</p>' +
        '<a href="/" class="btn-order-card">العودة للرئيسية</a>' +
      '</div>';
    return;
  }

  /* window.PRODUCT_SLUG is exactly what js/product-page.js already
     reads on every pre-rendered static page (see the generator's
     renderPage()) — reusing it here means this fallback and the real
     static pages render through the identical code path, so a product
     looks the same whether its static file has landed yet or not. */
  window.PRODUCT_SLUG = decodeURIComponent(m[2]);

  ['/js/product-template.js', '/js/book-template.js', '/js/product-page.js'].forEach(function (src) {
    var s = document.createElement('script');
    s.src = src;
    s.async = false; /* preserve load order: templates before product-page.js */
    document.body.appendChild(s);
  });
})();
</script>
