<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>تسجيل دخول الإدارة — Derradj Shop</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/jpeg" href="../Logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin-login.css" />
</head>

<body class="signup-page">

  <main class="signup-wrapper">
    <form class="signup-form" id="adminLoginForm" autocomplete="off">
      <div class="login-logo">Derradj <span>Shop</span></div>
      <div class="login-subtitle">لوحة الإدارة</div>
      <span class="admin-badge">🛡 Admin Portal</span>

      <h2>تسجيل دخول الإدارة</h2>

      <div class="form-group">
        <label for="contact">البريد الإلكتروني أو رقم الهاتف</label>
        <input type="text" id="contact" name="contact" placeholder="أدخل البريد أو رقم الهاتف" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password" />

        <div class="forgot-container">
          <a href="#" class="forgot-link" id="forgotBtn">نسيت كلمة المرور؟</a>
        </div>
      </div>

      <button type="submit">دخول</button>

      <p class="form-footer-text" id="statusText"></p>

      <p class="form-footer-text">
        هذه الصفحة مخصّصة للإدارة فقط
      </p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
