<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة موظفة المتابعة — Derradj Shop</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/png" href="../Logo.png">
  <link rel="manifest" href="/agent/manifest.json">
  <meta name="theme-color" content="#1B2A4A">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/agent/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/delivery-pricing.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font:       'Cairo', sans-serif;
      --navy:       #1B2A4A;
      --emerald:    #0F5132;
      --gold:       #C9A227;
      --ink:        #13201A;
      --paper:      #FBF7EF;
      --bg:         var(--paper);
      --white:      #ffffff;
      --border:     #e6e3d8;
      --text:       var(--ink);
      --text-light: #5b6b62;
      --text-muted: #8b968f;
      --primary:    var(--navy);
      --primary-bg: #eef1f6;
      --green:      var(--emerald);
      --green-light:#d7ece0;
      --radius:     10px;
      --radius-lg:  16px;
      --shadow-sm:  0 1px 3px rgba(19,32,26,.08);
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ━━ HEADER ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .agent-header {
      background: var(--navy);
      color: #fff;
      padding: 0 20px;
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,.25);
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 8px; padding-bottom: 8px;
    }
    .header-logo { font-size: 18px; font-weight: 900; }
    .header-logo span { color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .agent-badge {
      background: rgba(255,255,255,.1);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,.15);
    }

    .btn-logout {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      color: #fff;
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.18); }

    .btn-notify {
      background: rgba(201,162,39,.15);
      border: 1px solid rgba(201,162,39,.4);
      color: var(--gold);
      padding: 8px 14px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--font);
      transition: background .2s;
      white-space: nowrap;
    }
    .btn-notify:hover { background: rgba(201,162,39,.28); }

    /* ━━ PWA INSTALL POPUP — mirrors .confirm-overlay/.confirm-box ━━
       Shown only when a real beforeinstallprompt event is available. ━━ */
    .install-overlay {
      position: fixed; inset: 0; z-index: 6000;
      background: rgba(19, 32, 26, .45);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .install-overlay.open { display: flex; }
    .install-box {
      background: var(--white); border-radius: 16px; width: 100%; max-width: 340px;
      padding: 24px 22px 20px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      transform: scale(.9) translateY(8px); opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }
    .install-overlay.open .install-box { transform: scale(1) translateY(0); opacity: 1; }
    .install-title { font-size: 17px; font-weight: 900; color: var(--navy); margin-bottom: 10px; }
    .install-message { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 20px; }
    .install-note { display: none; font-size: 12px; color: var(--text-light); line-height: 1.6; margin: -12px 0 18px; }
    .install-actions { display: flex; flex-direction: column; gap: 10px; }
    .install-actions button {
      min-height: 46px; border-radius: 10px; border: none;
      font-family: var(--font); font-size: 14px; font-weight: 800; cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    .install-actions button:active { transform: scale(.97); }
    .install-btn-primary { background: var(--emerald); color: #fff; }
    .install-btn-primary:hover { filter: brightness(.93); }
    .install-btn-secondary { background: #eef0ee; color: #4b564f; }
    .install-btn-secondary:hover { background: #e2e5e1; }

    @media (max-width: 380px) {
      .install-box { padding: 20px 16px 16px; }
    }

    /* ━━ MAIN ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .agent-main { padding: 20px 16px 60px; max-width: 760px; margin: 0 auto; }

    /* ━━ EARNINGS WIDGET ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .earnings-widget {
      display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      border-right: 5px solid;
      flex: 1;
      min-width: 120px;
    }
    .stat-card.s-balance { border-right-color: var(--gold); }
    .stat-card.s-done    { border-right-color: var(--emerald); }
    .stat-card.s-month   { border-right-color: var(--navy); }
    .stat-num   { font-size: 24px; font-weight: 900; line-height: 1.1; }
    .stat-label { font-size: 11px; color: var(--text-light); font-weight: 700; }

    /* ━━ DELIVERY PRICING ENTRY POINT ━━━━━━━━━━━━━━━━━━━━━━━ */
    .btn-delivery-pricing {
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; min-height: 48px; margin-bottom: 18px;
      background: var(--white); border: 1px solid var(--border);
      border-right: 5px solid var(--gold);
      border-radius: var(--radius-lg); padding: 14px 16px;
      font-family: var(--font); font-size: 14px; font-weight: 800;
      color: var(--navy); box-shadow: var(--shadow-sm); cursor: pointer;
      transition: background .2s;
    }
    .btn-delivery-pricing:hover { background: var(--primary-bg); }

    /* ━━ DELIVERY PRICING MODAL — mirrors .install-overlay's fixed
       inset:0 centered-overlay pattern, but scrollable/wider to fit
       a long per-wilaya card list. ━━ */
    .dp-overlay {
      position: fixed; inset: 0; z-index: 6000;
      background: rgba(19, 32, 26, .55);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .dp-overlay.open { display: flex; }
    .dp-box {
      background: var(--white); border-radius: 18px; width: 100%; max-width: 720px;
      max-height: 90vh; max-height: 90svh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .dp-controls {
      padding: 14px 18px; display: flex; flex-direction: column; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--white);
    }
    .dp-filter-bar {
      display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 6px;
    }
    .dp-filter-bar .tab-btn { font-size: 13px; padding: 9px 10px; min-height: 40px; }
    .dp-body { padding: 14px 18px 20px; overflow-y: auto; flex: 1; overscroll-behavior: contain; }
    .dp-grid {
      display: grid; grid-template-columns: 1fr; gap: 10px;
    }
    @media (min-width: 560px) {
      .dp-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    }
    .dp-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow-sm);
    }
    .dp-card-name { font-size: 14px; font-weight: 800; margin-bottom: 8px; }
    .dp-price-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; padding: 7px 0; border-top: 1px solid var(--bg);
    }
    .dp-price-row:first-of-type { border-top: none; }
    .dp-price-label { color: var(--text-light); font-weight: 700; }
    .dp-price-val { font-weight: 800; color: var(--navy); direction: ltr; }
    .dp-price-val.unavailable { color: var(--text-muted); font-weight: 600; direction: rtl; }

    /* ━━ TABS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .tabs-bar {
      display: flex; gap: 4px; margin-bottom: 16px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 6px; box-shadow: var(--shadow-sm);
    }
    .tab-btn {
      position: relative;
      flex: 1; padding: 12px 14px; min-height: 44px; border: none;
      border-radius: var(--radius); font-family: var(--font);
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background .2s, color .2s; background: transparent;
      color: var(--text-light); display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    /* Small unread-message dot — purely additive, independent of the
       existing .tab-badge count/color logic below (untouched). */
    .tab-unread-dot {
      display: none;
      position: absolute; top: 6px; right: 10px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #dc2626; border: 2px solid var(--white);
    }
    .tab-unread-dot.show { display: block; }
    .tab-btn.active { background: var(--navy); color: #fff; }
    .tab-btn:not(.active):hover { background: var(--primary-bg); color: var(--navy); }
    .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px;
      font-size: 11px; font-weight: 900; background: rgba(255,255,255,.25);
    }
    .tab-btn:not(.active) .tab-badge { background: #eee; color: var(--text-light); }
    .tab-btn:not(.active) .tab-badge.unread { background: #dc2626; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ━━ CONTROLS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .controls-bar {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 12px 14px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .search-input {
      flex: 1; min-width: 160px; padding: 11px 14px; min-height: 44px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-size: 14px; font-family: var(--font); color: var(--text);
    }
    .search-input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(27,42,74,.12); }
    .filter-select {
      padding: 11px 12px; min-height: 44px; border: 1.5px solid var(--border);
      border-radius: var(--radius); font-size: 13px; font-family: var(--font);
      color: var(--text); background: var(--white); cursor: pointer;
    }
    .btn-refresh {
      padding: 11px 20px; min-height: 44px; background: var(--navy); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: var(--font); transition: background .2s; white-space: nowrap;
    }
    .btn-refresh:hover:not(:disabled) { background: #12203a; }
    .btn-refresh:disabled { background: var(--text-muted); cursor: default; }

    /* ━━ ORDER / MESSAGE CARDS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .card-list { display: flex; flex-direction: column; gap: 10px; }
    .o-card, .m-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm);
    }
    .o-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .o-card-name { font-size: 15px; font-weight: 800; }
    .o-card-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .o-card-grid { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
    .o-price { font-size: 16px; font-weight: 900; color: var(--navy); direction: ltr; }
    .o-meta  { font-size: 13px; color: var(--text-light); font-weight: 600; }

    /* ── Compact in-card status strip (5 short steps, no timestamps) —
       same physical left/width connector trick as the modal's .h-line;
       see the note on buildTimeline() for why it stays correct under
       dir="rtl". Sized down for a card instead of the full modal. ── */
    .mc-timeline { display: flex; margin: 0 0 12px; }
    .mc-step {
      position: relative; flex: 1 1 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .mc-line {
      position: absolute; left: 50%; top: 9px; width: 100%;
      height: 2px; background: var(--border); z-index: 0;
    }
    .mc-line.line-done { background: var(--emerald); }
    .mc-dot {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 900; color: var(--text-muted);
      background: var(--white); border: 2px solid var(--border);
      z-index: 1; margin-bottom: 3px;
    }
    .mc-dot.done      { background: var(--emerald); border-color: var(--emerald); color: #fff; }
    .mc-dot.cancelled { background: #dc2626; border-color: #dc2626; color: #fff; }
    .mc-label {
      font-size: 9.5px; font-weight: 700; color: var(--text); line-height: 1.15;
      white-space: normal; word-break: break-word; max-width: 100%;
    }
    .mc-label.muted { color: var(--text-muted); font-weight: 600; }

    .o-actions {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .o-actions > * {
      width: 100%; box-sizing: border-box; justify-content: center;
      text-align: center; white-space: normal; line-height: 1.25;
      min-height: 44px; padding: 10px 8px; font-size: 13px;
      display: flex; align-items: center; gap: 5px;
      border-radius: 8px; font-weight: 800; cursor: pointer;
      font-family: var(--font); text-decoration: none;
      transition: background .15s, color .15s;
    }

    .btn-call    { background: #eef1f6; color: var(--navy); border: 1.5px solid #c8d0dd; }
    .btn-call:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-confirm { background: var(--green-light); color: var(--emerald); border: 1.5px solid #a9d6bd; }
    .btn-confirm:hover:not(:disabled) { background: var(--emerald); color: #fff; border-color: var(--emerald); }
    .btn-confirm:disabled { background: #f1f1ea; color: var(--text-muted); border-color: var(--border); cursor: default; }
    .btn-delete  { background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; }
    .btn-delete:hover:not(:disabled) { background: #dc2626; color: #fff; border-color: #dc2626; }
    .btn-block   { background: #fef3c7; color: #92400e; border: 1.5px solid #fcd34d; }
    .btn-block:hover:not(:disabled) { background: #92400e; color: #fff; border-color: #92400e; }
    .btn-details { background: var(--primary-bg); color: var(--navy); border: 1.5px solid #c8d0dd; }
    .btn-details:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-cancel  { background: #f1f1ea; color: #6b6b5f; border: 1.5px solid #d8d8cc; }
    .btn-cancel:hover:not(:disabled) { background: #6b6b5f; color: #fff; border-color: #6b6b5f; }
    [disabled] { opacity: .55; cursor: default !important; }

    /* ━━ MESSAGES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .m-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .m-name  { font-weight: 800; font-size: 14px; }
    .m-time  { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .m-phone { font-size: 13px; color: var(--text-light); margin-bottom: 8px; direction: ltr; text-align: right; }
    .m-body  { font-size: 13px; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
    .m-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .m-actions > * {
      min-height: 44px; padding: 10px 8px; font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      border-radius: 8px; cursor: pointer; font-family: var(--font);
      text-decoration: none; transition: background .15s, color .15s;
    }

    /* ━━ ADD PRODUCT TAB ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    .prod-form {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 18px; max-width: 460px;
      margin-bottom: 22px; box-shadow: var(--shadow-sm);
    }
    .prod-fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .prod-fld label { font-size: 13px; font-weight: 700; color: var(--text-light); }
    .prod-fld input[type="text"], .prod-fld input[type="number"], .prod-fld select {
      padding: 11px 14px; min-height: 44px; border: 1.5px solid var(--border);
      border-radius: var(--radius); font-size: 14px; font-family: var(--font);
      color: var(--text); background: var(--white);
    }
    .prod-fld select { cursor: pointer; }
    .prod-fld input:focus, .prod-fld select:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(27,42,74,.12); }

    .prod-upload-box {
      border: 1.5px dashed var(--border); border-radius: var(--radius);
      padding: 18px; text-align: center; cursor: pointer; transition: border-color .2s;
    }
    .prod-upload-box:hover { border-color: var(--gold); }
    .prod-upload-box.loaded { border-style: solid; border-color: var(--emerald); }
    .prod-upload-box img { max-width: 100%; max-height: 160px; border-radius: 8px; display: block; margin: 0 auto 8px; }

    .btn-prod-submit {
      width: 100%; padding: 13px; min-height: 46px; background: var(--navy); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-weight: 800;
      cursor: pointer; font-family: var(--font); transition: background .2s;
    }
    .btn-prod-submit:hover:not(:disabled) { background: #12203a; }
    .btn-prod-submit:disabled { background: var(--text-muted); cursor: default; }

    .prod-section-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 12px; }

    .prod-list { display: flex; flex-direction: column; gap: 10px; max-width: 460px; }
    .prod-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow-sm);
    }
    .prod-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .prod-item-noimg {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 6px; background: var(--primary-bg);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .prod-item-name { font-size: 13px; font-weight: 700; color: var(--text); }

    .prod-badge {

    .empty-state {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 56px 20px; color: var(--text-muted); text-align: center;
    }
    .empty-state .es-icon { font-size: 40px; opacity: .6; }
    .empty-state .es-text { font-size: 14px; font-weight: 600; }

    /* ━━ LIVE TOAST — slides in from the bottom, auto-dismisses ━━ */
    .live-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(28px);
      background: var(--navy); color: #fff; padding: 12px 20px;
      border-radius: 12px; font-size: 13px; font-weight: 700;
      box-shadow: 0 8px 28px rgba(0,0,0,.3); z-index: 4000;
      opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none;
      max-width: 90vw; display: flex; align-items: center; gap: 8px;
    }
    .live-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .live-toast.success { background: var(--emerald); }
    .live-toast.error   { background: #dc2626; }

    /* ━━ CONFIRM MODAL — replaces native confirm()/alert() ━━━━━━━━
       Reusable via the showConfirm({title,message,confirmText,intent})
       promise-based helper — see #confirmOverlay markup + JS below. ━━ */
    .confirm-overlay {
      position: fixed; inset: 0; z-index: 5000;
      background: rgba(19, 32, 26, .55);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: var(--white); border-radius: 16px; width: 100%; max-width: 340px;
      padding: 26px 22px 22px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      transform: scale(.9) translateY(8px); opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }
    .confirm-overlay.open .confirm-box { transform: scale(1) translateY(0); opacity: 1; }
    .confirm-icon {
      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .confirm-icon.danger  { background: #fde2e2; }
    .confirm-icon.warning { background: #fbeec9; }
    .confirm-icon.success { background: var(--green-light); }
    .confirm-title   { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .confirm-message { font-size: 13.5px; color: var(--text-light); line-height: 1.65; margin-bottom: 22px; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions button {
      flex: 1; min-height: 46px; border-radius: 10px; border: none;
      font-family: var(--font); font-size: 14px; font-weight: 800; cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    .confirm-actions button:active { transform: scale(.97); }
    .confirm-btn-cancel { background: #eef0ee; color: #4b564f; }
    .confirm-btn-cancel:hover { background: #e2e5e1; }
    .confirm-btn-ok.danger  { background: #dc2626; color: #fff; }
    .confirm-btn-ok.warning { background: var(--gold); color: var(--ink); }
    .confirm-btn-ok.success { background: var(--emerald); color: #fff; }
    .confirm-btn-ok:hover { filter: brightness(.93); }

    @media (max-width: 380px) {
      .confirm-box { padding: 22px 18px 18px; }
    }

    /* ━━ MODAL (order details bottom-sheet) ━━━━━━━━━━━━━━━━━ */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(19,32,26,.55);
      z-index: 1000; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--white); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
      max-height: 92vh; max-height: 92svh;
      display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,.25); overflow: hidden;
    }
    @media (min-width: 600px) {
      .modal-overlay { align-items: center; padding: 16px; }

    }

      background: var(--navy); color: #fff; padding: 14px 18px;

    }
    .modal-title { font-size: 15px; font-weight: 900; }
    .modal-close {
      background: rgba(255,255,255,.1); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 8px; font-size: 16px;

    .modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--white); display: flex; gap: 8px; flex-wrap: wrap; }

      justify-content: center; font-size: 18px;
    }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }

    .product-price { font-size: 13px; font-weight: 800; direction: ltr; }

    .price-summary-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; color: var(--text-light); }
    .price-row .pv { direction: ltr; font-weight: 700; }
    .price-row.grand { border-top: 2px solid var(--border); margin-top: 6px; padding-top: 12px; font-size: 17px; font-weight: 900; color: var(--text); }
    .price-row.grand .pv { color: var(--navy); }

    /* ── Horizontal status timeline (order detail modal) ──────
       Physical left/width (not right) used for the connector so the
       math stays correct regardless of dir="rtl" — see inline note
       in buildTimeline(). ── */
    .h-timeline {
      display: flex; overflow-x: auto; scroll-snap-type: x proximity;
      padding: 4px 2px 6px; -webkit-overflow-scrolling: touch;
    }
    .h-step {
      position: relative; flex: 1 1 0; min-width: 58px;
      display: flex; flex-direction: column; align-items: center;
      text-align: center; scroll-snap-align: start; padding-top: 2px;
    }
    .h-line {
      position: absolute; left: 50%; top: 13px; width: 100%;
      height: 2px; background: var(--border); z-index: 0;
    }
    .h-line.line-done { background: var(--emerald); }
    .h-dot {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 900; color: var(--text-muted);
      background: var(--white); border: 2px solid var(--border);
      z-index: 1; margin-bottom: 6px;
    }
    .h-dot.done      { background: var(--emerald); border-color: var(--emerald); color: #fff; }
    .h-dot.cancelled { background: #dc2626; border-color: #dc2626; color: #fff; }
    .h-label { font-size: 10.5px; font-weight: 700; color: var(--text); line-height: 1.3; padding: 0 2px; }
    .h-label.muted { color: var(--text-muted); font-weight: 600; }
    .h-time { font-size: 9.5px; color: var(--text-muted); margin-top: 2px; direction: ltr; }

    @media (max-width: 480px) {
      .agent-main { padding: 14px 10px 60px; }
      .stat-card  { padding: 12px 12px; }
      .stat-num   { font-size: 20px; }

  </style>
</head>

(function () {

  const SUPABASE_URL      = "https://jbmcbjzcedqpvnhbmrhk.supabase.co";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ── State ─────────────────────────────────────────────── */
  let ALL_ORDERS      = [];

  const PM_LABELS = {

    ccp:              "🏦 CCP / RIP",
    prepaid:          "💳 دفع مسبق (CCP / BaridiMob)",
    cash_on_delivery: "🚪 دفع عند الاستلام",
  };
  const DT_LABELS = {
    home:   "🏠 توصيل للمنزل",

  const TIMELINE_STEPS = [

    { key: "shipped_at",          label: "🚚 تم الشحن" },

    { key: "delivered_at",        label: "📦 تم أخذ الطلبية" },
  ];
  /* Short labels for the compact in-card strip — same keys/order as
     TIMELINE_STEPS, no emoji (dropped to keep 5 steps + connectors
     inside an 18-20px-circle strip from overflowing a phone card). */
  const CARD_TIMELINE_STEPS = [
    { key: "created_at",          label: "استُلم" },
    { key: "confirmed_at",        label: "تأكيد" },
    { key: "shipped_at",          label: "شحن" },
    { key: "out_for_delivery_at", label: "جاري التسليم" },
    { key: "delivered_at",        label: "تم الأخذ" },
  ];

  /* ── Helpers ───────────────────────────────────────────── */
  function esc(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
  }
  function fmtDate(v) {
    if (!v) return "—";
    return new Date(v).toLocaleString("ar-DZ", {
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
    });
  }
  /* Compact "DD/MM HH:MM" (Western digits, 24h) — for the horizontal
     timeline, where fmtDate()'s full ar-DZ format is too wide. */
  function fmtShort(v) {
    if (!v) return "";
    const d = new Date(v);
    const p2 = n => String(n).padStart(2, "0");
    return `${p2(d.getDate())}/${p2(d.getMonth() + 1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;

  function fmtMoney(n) { return Number(n || 0).toLocaleString("fr-DZ") + " دج"; }
  function normPhone(v) { return String(v || "").replace(/\D/g, ""); }
  function emptyStateHTML(icon, text) {
    return `<div class="empty-state"><div class="es-icon">${icon}</div><div class="es-text">${esc(text)}</div></div>`;

  function disabledAttr(cond) { return cond ? "disabled" : ""; }

  /* ── Auth guard — agent role only ─────────────────────── */
  async function authGuard() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.href = "../admin/login.html"; return null; }

    const { data: staff, error } = await supabase
      .from("staff_accounts")
      .select("id, full_name, email, role, is_active")
      .eq("id", session.user.id)
      .maybeSingle();

    if (error || !staff || !staff.is_active || staff.role !== "agent") {
      await supabase.auth.signOut();
      location.href = "../admin/login.html";
      return null;
    }
    return staff;
  }

  /* ── Fetchers ──────────────────────────────────────────── */
  async function fetchMyOrders() {
    const { data, error } = await supabase
      .from("orders")
      .select(`
        id, order_number, full_name, phone, address, wilaya, commune,
        delivery_type, shipping_fee, subtotal, total_price,
        payment_method, receipt_url, notes, created_at,
        delivery_status, confirmed_at, shipped_at, out_for_delivery_at,
        delivered_at, cancelled_at,
        order_items ( id, product_name, quantity, unit_price, subtotal )
      `)
      .eq("assigned_agent_id", CURRENT_STAFF_ID)
      .order("created_at", { ascending: false })
      .limit(500);
    if (error) throw error;
    return data || [];
  }

  /* Shared inbox — RLS (messages_agent_select_unblocked) already
     scopes this to non-blocked numbers only; nothing to filter here. */
  async function fetchMessages() {
    const { data, error } = await supabase
      .from("messages")
      .select("id, name, contact, message, created_at")
      .order("created_at", { ascending: false })
      .limit(500);
    if (error) throw error;
    return data || [];
  }

  async function fetchBlockedPhones() {
    const { data, error } = await supabase
      .from("blocked_customers")
      .select("phone")
      .eq("is_active", true);
    if (error) { console.warn("fetchBlockedPhones:", error.message); return new Set(); }
    return new Set((data || []).map(r => normPhone(r.phone)));
  }

  async function fetchEarnings() {
    const { data, error } = await supabase
      .from("agent_earnings")
      .select("amount, created_at")
      .eq("agent_id", CURRENT_STAFF_ID)
      .order("created_at", { ascending: false });
    if (error) throw error;
    const rows = data || [];
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const total = rows.reduce((s, r) => s + Number(r.amount || 0), 0);
    const month = rows
      .filter(r => new Date(r.created_at) >= monthStart)
      .reduce((s, r) => s + Number(r.amount || 0), 0);
    return { total, count: rows.length, month };
  }

  /* ── Writes — RLS + guard_agent_order_update() enforce every
     boundary described here server-side too; the client checks are
     just UX (disabling buttons before the click even happens). ── */
  async function confirmOrder(orderId) {
    const { error } = await supabase.from("orders")
      .update({ delivery_status: "confirmed" }).eq("id", orderId);
    if (error) throw error;
  }
  async function cancelOrder(orderId) {
    const { error } = await supabase.from("orders")
      .update({ delivery_status: "cancelled" }).eq("id", orderId);
    if (error) throw error;
  }
  async function deleteOrder(orderId) {
    const { error } = await supabase.from("orders").delete().eq("id", orderId);
    if (error) throw error;
  }
  async function blockPhone(phone) {
    const { error } = await supabase.from("blocked_customers")
      .insert({ phone, blocked_by: CURRENT_STAFF_ID });
    if (error) throw error;
  }

  function getFilteredOrders() {

    if (phone) btns.push(`<a href="tel:${esc(phone)}" class="btn-call">📞 اتصال</a>`);

    btns.push(`<button class="btn-block" data-id="${esc(o.id)}" data-action="ord-block">🚫 حظر الرقم</button>`);

  /* Compact 5-step strip embedded in each order card — no timestamps
     (kept only in the detail modal's own buildTimeline()/.h-timeline,
     which this does not touch). A connector segment is Emerald when
     the step it leads INTO is done, so the emerald run always ends
     exactly at the furthest-completed step and nothing beyond it. */
  function buildCardTimeline(o) {
    const isCancelled = o.delivery_status === "cancelled";
    const steps = isCancelled
      ? [{ key: "created_at", label: "استُلم" }, { key: "cancelled_at", label: "ملغاة" }]
      : CARD_TIMELINE_STEPS;
    return `<div class="mc-timeline">${steps.map((s, i) => {
      const done = !!o[s.key];
      const dotClass = done ? (s.key === "cancelled_at" ? "cancelled" : "done") : "";
      return `
        <div class="mc-step">
          ${i > 0 ? `<div class="mc-line ${done ? "line-done" : ""}"></div>` : ""}
          <div class="mc-dot ${dotClass}">${done ? "✓" : ""}</div>
          <div class="mc-label ${done ? "" : "muted"}">${esc(s.label)}</div>
        </div>`;
    }).join("")}</div>`;
  }

  function buildOrderCard(o) {
    const items = o.order_items || [];
    const totalQty = items.reduce((s, it) => s + (Number(it.quantity) || 0), 0);
    return `
      <div class="o-card" data-id="${esc(o.id)}">
        <div class="o-card-head">
          <div>
            <div class="o-card-name">${esc(o.full_name || "—")}</div>
            <div class="o-card-sub">#${esc(o.order_number ?? "—")}</div>

          <span class="o-meta">📍 ${esc(o.wilaya || "—")}</span>
          <span class="o-meta">📦 ${totalQty} كتب</span>
        </div>
        ${buildCardTimeline(o)}
        <div class="o-actions">${buildOrderActions(o)}</div>
      </div>`;
  }

  function renderOrders() {
    const filtered = getFilteredOrders();
    const activeCount = ALL_ORDERS.filter(o => o.delivery_status !== "delivered" && o.delivery_status !== "cancelled").length;
    document.getElementById("tab-badge-orders").textContent = activeCount;

  /* Horizontal timeline, first step on the right (dir="rtl" on <html>
     makes a plain flex-row lay DOM order right-to-left on its own —
     no explicit reversing needed). The connector line inside step i
     (i>0) reaches back to step i-1's dot using PHYSICAL left/width
     (not right), which is what actually lands it there regardless of
     text direction: left:50% anchors its left edge at this step's own
     center, and width:100% extends it exactly one step further along
     the physical x-axis — which under RTL flex-row is where the
     previous DOM sibling (i-1) sits. Physical right/left in CSS never
     flip with dir, only the flex layout order does. */
  function buildTimeline(o) {
    const isCancelled = o.delivery_status === "cancelled";
    const steps = isCancelled
      ? [{ key: "created_at", label: "📝 استُلم الطلب" }, { key: "cancelled_at", label: "❌ تم الإلغاء" }]
      : TIMELINE_STEPS;
    return `<div class="h-timeline">${steps.map((s, i) => {
      const val  = o[s.key];
      const done = !!val;
      const prevDone = i > 0 && !!o[steps[i - 1].key];
      const dotClass = done ? (s.key === "cancelled_at" ? "cancelled" : "done") : "";
      return `
        <div class="h-step">
          ${i > 0 ? `<div class="h-line ${prevDone ? "line-done" : ""}"></div>` : ""}
          <div class="h-dot ${dotClass}">${done ? "✓" : ""}</div>
          <div class="h-label ${done ? "" : "muted"}">${s.label}</div>
          ${done ? `<div class="h-time">${esc(fmtShort(val))}</div>` : ""}
        </div>`;
    }).join("")}</div>`;
  }

  async function withBusyButton(btn, fn) {
    if (!btn) return fn();
    btn.disabled = true;
    const prev = btn.innerHTML;
    btn.innerHTML = "⏳...";
    try { await fn(); }
    finally { if (document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = prev; } }
  }

  async function handleConfirm(orderId, btn) {
    const o = ALL_ORDERS.find(x => x.id === orderId);
    const name = o?.full_name || "هذه الطلبية";
    const ok = await showConfirm({
      title: "تأكيد الطلبية",
      message: `تأكيد طلبية "${name}"؟`,
      confirmText: "نعم، أكّد",
      intent: "success",
    });
    if (!ok) return;
    try {
      await withBusyButton(btn, () => confirmOrder(orderId));
      const o = ALL_ORDERS.find(x => x.id === orderId);
      if (o) { o.delivery_status = "confirmed"; o.confirmed_at = new Date().toISOString(); }
      renderOrders();
      if (ACTIVE_ORDER_ID === orderId) showOrderModal(orderId);
    } catch (err) {
      showToast("❌ فشل تأكيد الطلبية: " + (err.message || ""), "error");
    }
  }

  async function handleCancel(orderId, btn) {
    const ok = await showConfirm({
      title: "إلغاء الطلبية",
      message: "هل تريد إلغاء هذه الطلبية؟",
      confirmText: "نعم، ألغِ",
      intent: "warning",
    });
    if (!ok) return;
    try {
      await withBusyButton(btn, () => cancelOrder(orderId));
      const o = ALL_ORDERS.find(x => x.id === orderId);
      if (o) { o.delivery_status = "cancelled"; o.cancelled_at = new Date().toISOString(); }
      renderOrders();
      if (ACTIVE_ORDER_ID === orderId) showOrderModal(orderId);
    } catch (err) {
      showToast("❌ فشل إلغاء الطلبية: " + (err.message || ""), "error");
    }
  }

  async function handleDelete(orderId, btn) {
    const o = ALL_ORDERS.find(x => x.id === orderId);
    const name = o?.full_name || "هذه الطلبية";
    const ok = await showConfirm({
      title: "حذف الطلبية",
      message: `هل أنت متأكد من حذف طلبية "${name}"؟ لا يمكن التراجع عن هذا الإجراء.`,
      confirmText: "نعم، احذف",
      intent: "danger",
    });
    if (!ok) return;
    try {
      await withBusyButton(btn, () => deleteOrder(orderId));
      ALL_ORDERS = ALL_ORDERS.filter(x => x.id !== orderId);
      renderOrders();
      if (ACTIVE_ORDER_ID === orderId) closeModal();
    } catch (err) {
      showToast("❌ فشل حذف الطلبية: " + (err.message || ""), "error");
    }
  }

  async function handleBlock(orderId, btn) {
    const o = ALL_ORDERS.find(x => x.id === orderId);
    const phone = (o?.phone || "").trim();
    if (!phone) return;
    const ok = await showConfirm({
      title: "حظر الرقم",
      message: `سيتم حظر الرقم ${phone} نهائيا ولن يتمكن من إرسال طلبيات أو رسائل.`,
      confirmText: "نعم، احظر",
      intent: "warning",
    });
    if (!ok) return;
    try {
      await withBusyButton(btn, () => blockPhone(phone));
      BLOCKED_PHONES.add(normPhone(phone));
      showToast("✅ تم حظر الرقم", "success");
      ALL_MESSAGES = ALL_MESSAGES.filter(m => normPhone(m.contact) !== normPhone(phone));
      renderMessages();
    } catch (err) {
      if (err.code === "23505") showToast("⚠️ هذا الرقم محظور بالفعل", "error");
      else showToast("❌ فشل حظر الرقم: " + (err.message || ""), "error");
    }
  }

  /* ═══════════════════════════════════════════════════════════
     MESSAGES (shared inbox, minus blocked numbers)
  ═══════════════════════════════════════════════════════════ */
  function getFilteredMessages() {
    const q = (document.getElementById("msgSearchInput")?.value || "").trim().toLowerCase();
    const visible = ALL_MESSAGES.filter(m => !BLOCKED_PHONES.has(normPhone(m.contact)));
    if (!q) return visible;
    return visible.filter(m =>
      (m.name || "").toLowerCase().includes(q) ||
      (m.contact || "").includes(q) ||
      (m.message || "").toLowerCase().includes(q)
    );
  }

        <div class="m-card-head">

          <span class="m-time">${esc(fmtDate(m.created_at))}</span>
        </div>
        <div class="m-phone">${esc(phone || "—")}</div>
        <div class="m-body">${esc(m.message || "—")}</div>

        </div>
      </div>`;

  function renderMessages() {
    const filtered = getFilteredMessages();
    document.getElementById("tab-badge-messages").textContent = filtered.length;
    const badgeEl = document.getElementById("tab-badge-messages");
    badgeEl.classList.toggle("unread", UNSEEN_MESSAGES > 0);
    if (UNSEEN_MESSAGES > 0) badgeEl.textContent = UNSEEN_MESSAGES + " جديد";
    document.getElementById("tab-unread-dot-messages")?.classList.toggle("show", UNSEEN_MESSAGES > 0);

    const list = document.getElementById("msgList");
    if (!filtered.length) {
      list.innerHTML = emptyStateHTML("✉️", "لا توجد رسائل حالياً");

    list.innerHTML = filtered.map(buildMessageCard).join("");

  async function handleBlockMessage(msgId, btn) {
    const m = ALL_MESSAGES.find(x => x.id === msgId);
    const phone = (m?.contact || "").trim();
    if (!phone) return;
    const ok = await showConfirm({
      title: "حظر الرقم",

      confirmText: "نعم، احظر",
      intent: "warning",
    });
    if (!ok) return;

      renderMessages();
    } catch (err) {
      if (err.code === "23505") showToast("⚠️ هذا الرقم محظور بالفعل", "error");

  /* ── Unread tracking (per-device, localStorage) ─────────── */
  function getLastSeenMessages() {
    return localStorage.getItem("derradj_agent_msgs_seen") || "";
  }
  function markMessagesSeen() {
    if (!ALL_MESSAGES.length) return;
    localStorage.setItem("derradj_agent_msgs_seen", ALL_MESSAGES[0].created_at);
    UNSEEN_MESSAGES = 0;
    renderMessages();
  }
  function computeUnseenMessages() {
    const lastSeen = getLastSeenMessages();
    if (!lastSeen) { UNSEEN_MESSAGES = 0; return; }
    UNSEEN_MESSAGES = ALL_MESSAGES.filter(m =>
      new Date(m.created_at) > new Date(lastSeen) && !BLOCKED_PHONES.has(normPhone(m.contact))
    ).length;
  }

     MODAL
  ═══════════════════════════════════════════════════════════ */

  function closeModal() {
    document.getElementById("modal").classList.remove("open");
    document.getElementById("modalFooter").innerHTML = "";
    ACTIVE_ORDER_ID = null;

  /* ═══════════════════════════════════════════════════════════
     DELIVERY PRICING VIEWER — read-only, static data only
     (window.WILAYA_CODE / window.SHIPPING_PRICES from
     js/delivery-pricing.js). No Supabase calls, no order data.
  ═══════════════════════════════════════════════════════════ */
  let DP_FILTER = "all";

  function getWilayaRows() {
    const codes  = window.WILAYA_CODE;
    const prices = window.SHIPPING_PRICES;
    if (!codes || !prices || !Object.keys(codes).length) return null;
    return Object.entries(codes)
      .map(([name, code]) => ({ name, code, price: prices[code] || null }))
      .sort((a, b) => a.code - b.code);
  }

  function buildDeliveryCard(row) {
    const p = row.price;
    const showHome   = DP_FILTER !== "office";
    const showOffice = DP_FILTER !== "home";
    const homeHTML = showHome
      ? `<div class="dp-price-row"><span class="dp-price-label">🏠 المنزل</span><span class="dp-price-val${p ? "" : " unavailable"}">${p ? esc(fmtMoney(p.h)) : "غير متوفر"}</span></div>`
      : "";
    const officeHTML = showOffice
      ? `<div class="dp-price-row"><span class="dp-price-label">🏢 المكتب</span><span class="dp-price-val${(p && p.o != null) ? "" : " unavailable"}">${(p && p.o != null) ? esc(fmtMoney(p.o)) : "غير متوفر"}</span></div>`
      : "";
    return `<div class="dp-card"><div class="dp-card-name">📍 ${esc(row.name)}</div>${homeHTML}${officeHTML}</div>`;
  }

  function renderDeliveryPricing() {
    const body = document.getElementById("dpBody");
    const rows = getWilayaRows();
    if (!rows) { body.innerHTML = emptyStateHTML("🚚", "تعذر تحميل بيانات أسعار التوصيل"); return; }
    const q = (document.getElementById("dpSearchInput")?.value || "").trim();
    const filtered = q ? rows.filter(r => r.name.includes(q) || String(r.code).includes(q)) : rows;
    if (!filtered.length) { body.innerHTML = emptyStateHTML("🔎", "لا توجد نتائج مطابقة"); return; }
    body.innerHTML = `<div class="dp-grid">${filtered.map(buildDeliveryCard).join("")}</div>`;
  }

  function openDeliveryPricing()  { document.getElementById("dpOverlay").classList.add("open"); renderDeliveryPricing(); }
  function closeDeliveryPricing() { document.getElementById("dpOverlay").classList.remove("open"); }

  /* ═══════════════════════════════════════════════════════════
     CONFIRM MODAL — promise-based replacement for native confirm().
     Usage: const ok = await showConfirm({ title, message, confirmText, intent });
     intent: 'danger' | 'warning' | 'success'. Resolves true/false;
     never rejects (backdrop click / Escape / إلغاء all resolve false).
  ═══════════════════════════════════════════════════════════ */
  const CONFIRM_ICONS = { danger: "🗑️", warning: "🚫", success: "✅" };
  let CONFIRM_RESOLVE = null;

  function showConfirm({ title = "", message = "", confirmText = "تأكيد", intent = "success", icon } = {}) {
    document.getElementById("confirmIcon").className   = "confirm-icon " + intent;
    document.getElementById("confirmIcon").textContent  = icon || CONFIRM_ICONS[intent] || "❓";
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmMessage").textContent = message;
    const okBtn = document.getElementById("confirmOkBtn");
    okBtn.className   = "confirm-btn-ok " + intent;
    okBtn.textContent = confirmText;

    document.getElementById("confirmOverlay").classList.add("open");
    return new Promise(resolve => { CONFIRM_RESOLVE = resolve; });
  }

  function closeConfirm(result) {
    document.getElementById("confirmOverlay").classList.remove("open");
    if (CONFIRM_RESOLVE) { CONFIRM_RESOLVE(result); CONFIRM_RESOLVE = null; }
  }

  /* ═══════════════════════════════════════════════════════════
     ADD PRODUCT TAB — quick "submit for admin review" flow.
     Mirrors seller/dashboard.html's qadd* pattern (image upload path
     convention, admin_products_catalog insert shape). A parallel DB
     migration enforces server-side (via a trigger) that only a fixed
     set of fields survive an agent-role insert and forces
     status/is_active/submitted_by regardless of payload — the client
     validation below is only for a good UX, not the security boundary.
  ═══════════════════════════════════════════════════════════ */
  async function fetchCategories() {
    const { data, error } = await supabase
      .from("categories")
      .select("*")
      .eq("is_active", true)
      .order("sort_order");
    if (error) { console.error("fetchCategories:", error); return []; }
    return data || [];
  }

  async function fetchMyProducts() {
    const { data, error } = await supabase
      .from("admin_products_catalog")
      .select("id,product_name,main_image,status")
      .eq("submitted_by", CURRENT_STAFF_ID)
      .order("submitted_at", { ascending: false })
      .limit(10);
    if (error) { console.error("fetchMyProducts:", error); return []; }
    return data || [];
  }

  function renderCategoryOptions() {
    const sel = document.getElementById("prodCategory");
    if (!sel) return;
    const prevValue = sel.value;
    const opts = CATEGORIES.map(c =>
      `<option value="${esc(c.slug)}">${esc((c.icon ? c.icon + " " : "") + c.name)}</option>`
    ).join("");
    sel.innerHTML =
      `<option value="" selected disabled>اختر الفئة...</option>` +
      opts +
      `<option value="__new__">+ فئة جديدة</option>`;
    if (prevValue && [...sel.options].some(o => o.value === prevValue)) sel.value = prevValue;
  }

  function productStatusBadge(status) {
    return status === "published"
      ? `<span class="prod-badge published">✅ منشور</span>`
      : `<span class="prod-badge pending">⏳ قيد المراجعة</span>`;
  }

  function renderMyProducts() {
    const wrap = document.getElementById("prodListWrap");
    if (!wrap) return;
    if (!MY_PRODUCTS.length) {
      wrap.innerHTML = emptyStateHTML("🛒", "لم ترسل أي منتج بعد.");
      return;
    }
    wrap.innerHTML = MY_PRODUCTS.map(p => `
      <div class="prod-item">
        ${p.main_image ? `<img src="${esc(p.main_image)}" alt="">` : `<div class="prod-item-noimg">📦</div>`}
        <div style="flex:1;">
          <div class="prod-item-name">${esc(p.product_name || "—")}</div>
        </div>
        ${productStatusBadge(p.status)}
      </div>`).join("");
  }

  async function loadAddProductTab() {
    const [cats, products] = await Promise.all([fetchCategories(), fetchMyProducts()]);
    CATEGORIES = cats;
    MY_PRODUCTS = products;
    renderCategoryOptions();
    renderMyProducts();
  }

  /* Lowercase + trim + collapse runs of non-alphanumeric (ASCII-only,
     so Arabic names fall through to the timestamp fallback rather than
     producing an empty/garbled slug) into "-", then strip leading/
     trailing "-". */
  function slugifyCategoryName(name) {
    const base = String(name || "")
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
    return base || `cat-${Date.now()}`;
  }

  /* Same bucket/path convention as seller/dashboard.html's
     uploadQaddImage() / admin/products-manager.js uploadMainImage(). */
  async function uploadProdImage(file) {
    const box  = document.getElementById("prodUploadBox");
    const prev = document.getElementById("prodUploadPrev");
    prev.innerHTML = `<div>⏳ جاري الرفع...</div>`;
    try {
      const ext  = file.name.split(".").pop();
      const path = `products/${Date.now()}-${Math.random().toString(36).slice(2, 9)}.${ext}`;

      const { error: upErr } = await supabase.storage.from("admin-product-images").upload(path, file, { cacheControl: "3600", upsert: false });
      if (upErr) throw upErr;

      const { data: { publicUrl } } = supabase.storage.from("admin-product-images").getPublicUrl(path);
      document.getElementById("prodImageUrl").value = publicUrl;
      prev.innerHTML = `<img src="${esc(publicUrl)}" alt=""><div>✅ تم رفع الصورة</div>`;
      box.classList.add("loaded");
    } catch (err) {
      prev.innerHTML = `<div>📷 انقر لرفع صورة المنتج</div>`;
      showToast("❌ فشل رفع الصورة: " + (err.message || ""), "error");
    }
  }

  /* The client sends real values for product_name/main_image/category/
     subcategory/price, but per the migration note above, status/
     is_active/submitted_by/submitted_at are re-forced server-side
     regardless of what's sent here — nothing to smuggle in even from a
     modified client. */
  async function submitProduct(e) {
    e.preventDefault();

    const btn         = document.getElementById("prodSubmitBtn");
    const statusMsg    = document.getElementById("prodStatusMsg");
    const catSel       = document.getElementById("prodCategory");
    const newCatInput  = document.getElementById("prodNewCategoryName");
    const name         = document.getElementById("prodName").value.trim();
    const imageUrl     = document.getElementById("prodImageUrl").value;
    const priceRaw     = document.getElementById("prodPrice").value;
    const price        = parseInt(priceRaw, 10);

    statusMsg.textContent = "";

    if (!name) {
      statusMsg.textContent = "❌ اسم المنتج مطلوب";
      statusMsg.style.color = "#b91c1c";
      return;
    }
    if (!catSel.value || (catSel.value === "__new__" && !newCatInput.value.trim())) {
      statusMsg.textContent = "❌ الفئة مطلوبة";
      statusMsg.style.color = "#b91c1c";
      return;
    }
    if (!imageUrl) {
      statusMsg.textContent = "❌ الصورة مطلوبة";
      statusMsg.style.color = "#b91c1c";
      return;
    }
    if (!priceRaw || !Number.isFinite(price) || price <= 0 || String(price) !== priceRaw.trim()) {
      statusMsg.textContent = "❌ السعر مطلوب ويجب أن يكون رقماً موجباً";
      statusMsg.style.color = "#b91c1c";
      return;
    }

    btn.disabled = true; btn.textContent = "⏳ جاري الإرسال...";
    try {
      let subcategory;
      if (catSel.value === "__new__") {
        const newName = newCatInput.value.trim();
        const slug = slugifyCategoryName(newName);
        const { data: newCat, error: catErr } = await supabase
          .from("categories")
          .insert({ name: newName, slug, is_active: true })
          .select()
          .single();
        if (catErr) throw catErr;
        subcategory = newCat.slug;
        CATEGORIES.push(newCat);
      } else {
        subcategory = catSel.value;
      }

      const { error } = await supabase.from("admin_products_catalog").insert({
        product_name: name,
        main_image:   imageUrl,
        category:     "electronics",
        subcategory:  subcategory,
        price:        price,
        status:       "pending_review",
        is_active:    false,
        submitted_by: CURRENT_STAFF_ID,
        submitted_at: new Date().toISOString(),
      });
      if (error) throw error;

      statusMsg.textContent = "تم إرسال المنتج للمراجعة، سيظهر في المتجر بعد موافقة الإدارة.";
      statusMsg.style.color = "#0F5132";
      document.getElementById("prodForm").reset();
      document.getElementById("prodImageUrl").value = "";
      document.getElementById("prodUploadBox").classList.remove("loaded");
      document.getElementById("prodUploadPrev").innerHTML = `<div>📷 انقر لرفع صورة المنتج</div>`;
      newCatInput.style.display = "none";
      newCatInput.value = "";
      renderCategoryOptions();

      MY_PRODUCTS = await fetchMyProducts();
      renderMyProducts();
    } catch (err) {
      statusMsg.textContent = "❌ فشل الإرسال: " + (err.message || "");
      statusMsg.style.color = "#b91c1c";
    } finally {
      btn.disabled = false; btn.textContent = "📤 إرسال للمراجعة";
    }
  }

  /* ═══════════════════════════════════════════════════════════
     LIVE NOTIFICATIONS
  ═══════════════════════════════════════════════════════════ */
  /* type: 'success' | 'error' | omitted (neutral/info — live order &
     message notifications). The leading emoji already embedded in
     every call site's message string doubles as the toast's icon. */
  function showToast(message, type) {
    const el = document.createElement("div");
    el.className = "live-toast" + (type ? " " + type : "");
    el.textContent = message;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3000);
  }

  function setupRealtime() {
    supabase
      .channel("agent-dashboard-" + CURRENT_STAFF_ID)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "orders", filter: `assigned_agent_id=eq.${CURRENT_STAFF_ID}` },
          payload => {
            const o = payload.new;
            const idx = ALL_ORDERS.findIndex(x => x.id === o.id);
            if (idx === -1) { ALL_ORDERS.unshift(o); showToast("📦 طلبية جديدة معيّنة لك: " + (o.full_name || "—")); }
            else { ALL_ORDERS[idx] = { ...ALL_ORDERS[idx], ...o }; }
            renderOrders();
            if (ACTIVE_ORDER_ID === o.id) showOrderModal(o.id);
          })
      /* The admin's "تم أخذ الطلبية" button pays the commission via
         mark_order_delivered() — this is what makes رصيدي/رصيد هذا الشهر
         update the moment that happens, not just on next page load. */
      .on("postgres_changes",
          { event: "INSERT", schema: "public", table: "agent_earnings", filter: `agent_id=eq.${CURRENT_STAFF_ID}` },
          () => { refreshEarnings(); showToast("💰 تم إضافة عمولة جديدة إلى رصيدك"); })
      /* Shared inbox — no filter; blocked numbers are excluded client-side
         (BLOCKED_PHONES) as a defensive check in case a realtime payload
         ever arrives ahead of the RLS-backed initial SELECT. */
      .on("postgres_changes",
          { event: "INSERT", schema: "public", table: "messages" },
          payload => {
            const m = payload.new;
            if (BLOCKED_PHONES.has(normPhone(m.contact))) return;
            ALL_MESSAGES.unshift(m);
            UNSEEN_MESSAGES++;
            showToast("✉️ رسالة جديدة من: " + (m.name || "—"));
            renderMessages();
          })
      .subscribe();
  }

  /* ═══════════════════════════════════════════════════════════
     PWA — install banner, notification permission, service-worker
     registration, and polling-based local notifications.

     LIMITATION: this is Supabase polling + a service-worker
     showNotification(), not server-side push. There is no Firebase,
     VAPID, or push server involved. Notifications only fire while
     this dashboard/PWA is open and actively polling (or for the
     short window Android keeps a service worker alive right after
     the page closes) — they cannot wake the app once it has been
     fully terminated by the OS.
  ═══════════════════════════════════════════════════════════ */
  let SW_REGISTRATION       = null;
  let POLL_IN_PROGRESS      = false;
  let DEFERRED_INSTALL_PROMPT = null;

  function lastOrderKey() { return `agent_last_order_id_${CURRENT_STAFF_ID}`; }
  function lastMsgKey()   { return `agent_last_msg_id_${CURRENT_STAFF_ID}`; }

  /* Stored as {id, created_at} rather than a bare id — order/message
     ids are UUIDs (not sortable), so created_at is what makes "is this
     genuinely newer" a reliable comparison across polls. */
  function readLastSeen(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return (parsed && parsed.created_at) ? parsed : null;
    } catch (err) { return null; }
  }
  function writeLastSeen(key, item) {
    try { localStorage.setItem(key, JSON.stringify({ id: item.id, created_at: item.created_at })); }
    catch (err) { /* localStorage unavailable — degrade silently, no notifications */ }
  }

  /* First load ever (empty localStorage) must never notify — this just
     seeds the baseline. A pre-existing baseline is left untouched, so
     items that arrived while the agent was logged out still notify on
     the next poll after logging back in. */
  function seedNotificationBaseline() {
    try {
      if (!readLastSeen(lastOrderKey()) && ALL_ORDERS.length)   writeLastSeen(lastOrderKey(), ALL_ORDERS[0]);
      if (!readLastSeen(lastMsgKey())   && ALL_MESSAGES.length) writeLastSeen(lastMsgKey(), ALL_MESSAGES[0]);
    } catch (err) { console.warn("seedNotificationBaseline:", err); }
  }

  function findNewItems(list, lastSeen) {
    if (!lastSeen) return [];
    const lastTime = new Date(lastSeen.created_at).getTime();
    return list.filter(item => {
      const t = new Date(item.created_at).getTime();
      return t > lastTime || (t === lastTime && item.id !== lastSeen.id);
    });
  }

  /* Short, unobtrusive beep via Web Audio API — no audio file, no
     dependency. Browsers may block audio before a user gesture; if so
     this just silently no-ops and notification logic continues. */
  function playBeep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx  = new Ctx();
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      osc.connect(gain).connect(ctx.destination);
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.22);
      osc.onended = () => { try { ctx.close(); } catch (err) {} };
    } catch (err) { console.warn("playBeep:", err); }
  }

  async function sendSwNotification({ title, body, tag, url }) {
    try {
      if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
      if (!("serviceWorker" in navigator)) return;
      const reg = SW_REGISTRATION || await navigator.serviceWorker.ready;
      if (!reg || !reg.active) return;
      reg.active.postMessage({
        type: "NOTIFY",
        title, body,
        icon: "/agent/icons/icon-192.png",
        badge: "/agent/icons/icon-192.png",
        tag,
        url: url || "/agent/dashboard.html",
      });
      playBeep();
    } catch (err) { console.warn("sendSwNotification:", err); }
  }

  function notifyNewOrder(o) {
    sendSwNotification({
      title: "طلبية جديدة",
      body: `${o.full_name || "—"} — ${o.wilaya || "—"} — ${fmtMoney(o.total_price)}`,
      tag: "order-" + o.id,
    });
  }
  function notifyNewMessage(m) {
    sendSwNotification({
      title: "رسالة جديدة",
      body: (m.message || "").slice(0, 140),
      tag: "msg-" + m.id,
    });
  }

  /* Automatic 30s polling — reuses the existing fetchMyOrders()/
     fetchMessages() fetchers (same ones the manual "تحديث" buttons
     use) so there is no second/independent data-fetching system. */
  async function pollForUpdates() {
    if (POLL_IN_PROGRESS) return;
    POLL_IN_PROGRESS = true;
    try {
      const [orders, messages] = await Promise.all([fetchMyOrders(), fetchMessages()]);
      const newOrders = findNewItems(orders, readLastSeen(lastOrderKey()));
      const newMsgs   = findNewItems(messages, readLastSeen(lastMsgKey()))
        .filter(m => !BLOCKED_PHONES.has(normPhone(m.contact)));

      ALL_ORDERS   = orders;
      ALL_MESSAGES = messages;
      computeUnseenMessages();
      renderOrders();
      renderMessages();

      newOrders.slice().reverse().forEach(notifyNewOrder);
      newMsgs.slice().reverse().forEach(notifyNewMessage);

      if (orders.length)   writeLastSeen(lastOrderKey(), orders[0]);
      if (messages.length) writeLastSeen(lastMsgKey(), messages[0]);
    } catch (err) {
      console.warn("pollForUpdates:", err);
    } finally {
      POLL_IN_PROGRESS = false;
    }
  }

  function initNotifyButton() {
    const btn = document.getElementById("notifyPermBtn");
    if (!btn) return;
    try {
      if (typeof Notification === "undefined") { btn.style.display = "none"; return; }
      if (Notification.permission === "granted") { btn.style.display = "none"; return; }
      btn.style.display = "";
      btn.addEventListener("click", async () => {
        try {
          const result = await Notification.requestPermission();
          if (result === "granted") btn.style.display = "none";
          // "denied" — browsers refuse to re-prompt anyway; keep the
          // dashboard fully usable, don't force anything further.
        } catch (err) { console.warn("Notification.requestPermission:", err); }
      });
    } catch (err) { console.warn("initNotifyButton:", err); btn.style.display = "none"; }
  }

  async function registerServiceWorker() {
    try {
      if (!("serviceWorker" in navigator)) return;
      SW_REGISTRATION = await navigator.serviceWorker.register("/agent/sw.js", { scope: "/agent/" });
    } catch (err) { console.warn("Service worker registration failed:", err); }
  }

  function showInstallPopup(mode) {
    const overlay = document.getElementById("installOverlay");
    if (!overlay) return;
    const title = document.getElementById("installTitle");
    const msg = document.getElementById("installMessage");
    const note = document.getElementById("installNote");
    const primaryBtn = document.getElementById("installPrimaryBtn");
    if (mode === "manual") {
      if (title) title.textContent = "📲 لتثبيت تطبيق Derradj Agent";
      if (msg) msg.textContent = "افتح قائمة المتصفح ⋮ ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية» إذا ظهر الخيار.";
      if (note) {
        note.textContent = "إذا لم يظهر خيار التثبيت، جرّب فتح الصفحة في Chrome على Android.";
        note.style.display = "block";
      }
      if (primaryBtn) primaryBtn.style.display = "none";
    } else {
      if (title) title.textContent = "📲 تثبيت تطبيق Derradj Agent";
      if (msg) msg.textContent = "ثبّت التطبيق على هاتفك للوصول السريع إلى لوحة الوكلاء واستقبال التنبيهات.";
      if (note) { note.textContent = ""; note.style.display = "none"; }
      if (primaryBtn) primaryBtn.style.display = "";
    }
    overlay.classList.add("open");
  }

  function hideInstallPopup() {
    document.getElementById("installOverlay")?.classList.remove("open");
  }

  function initInstallPopup() {
    const overlay = document.getElementById("installOverlay");
    if (!overlay) return;
    try {
      if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return;

      let dismissed = false;

      /* Feature detection, not browser sniffing: Chromium-based browsers
         (Chrome, Brave, Samsung Internet, Edge...) all expose this IDL
         attribute on window when they implement the install-prompt API,
         whether or not the event ends up firing for this page load.
         Browsers that never implement the API (Firefox Android, many
         in-app WebViews) never expose it either — so its absence is a
         reliable, standards-based signal that beforeinstallprompt will
         structurally never fire here, and manual instructions are the
         only honest option. */
      const promptCapable = "onbeforeinstallprompt" in window;

      window.addEventListener("beforeinstallprompt", e => {
        e.preventDefault();
        DEFERRED_INSTALL_PROMPT = e;
        if (!dismissed) showInstallPopup("prompt");
      });

      document.getElementById("installPrimaryBtn")?.addEventListener("click", async () => {
        if (!DEFERRED_INSTALL_PROMPT) return;
        try {
          DEFERRED_INSTALL_PROMPT.prompt();
          await DEFERRED_INSTALL_PROMPT.userChoice;
        } catch (err) { console.warn("install prompt:", err); }
        DEFERRED_INSTALL_PROMPT = null;
        hideInstallPopup();
      });

      document.getElementById("installSecondaryBtn")?.addEventListener("click", () => {
        dismissed = true;
        hideInstallPopup();
      });

      overlay.addEventListener("click", e => {
        if (e.target === overlay) {
          dismissed = true;
          hideInstallPopup();
        }
      });

      window.addEventListener("appinstalled", () => {
        dismissed = true;
        DEFERRED_INSTALL_PROMPT = null;
        hideInstallPopup();
      });

      /* Browser structurally cannot fire the real event — show manual
         instructions now instead of waiting on something that will
         never happen. If it somehow fires anyway, the listener above
         still switches the popup into "prompt" mode. */
      if (!promptCapable && !dismissed) showInstallPopup("manual");
    } catch (err) { console.warn("initInstallPopup:", err); }
  }

  /* ── Boot ──────────────────────────────────────────────── */
  async function boot() {
    try {
      const staff = await authGuard();
      if (!staff) return;
      CURRENT_STAFF_ID = staff.id;

      document.getElementById("agentBadge").textContent =
        "📞" + (staff.full_name ? " " + staff.full_name : "");

      const [orders, messages, blocked, earnings] = await Promise.all([
        fetchMyOrders(), fetchMessages(), fetchBlockedPhones(), fetchEarnings(),
      ]);
      ALL_ORDERS = orders;
      ALL_MESSAGES = messages;
      BLOCKED_PHONES = blocked;
      computeUnseenMessages();

      renderEarnings(earnings);
      renderOrders();
      renderMessages();
      bindEvents();
      setupRealtime();

      seedNotificationBaseline();
      initNotifyButton();
      setInterval(pollForUpdates, 30000);
    } catch (err) {
      console.error("Boot error:", err);
      showToast("❌ خطأ في تحميل الصفحة: " + (err.message || JSON.stringify(err)), "error");
    }
  }

  /* Registered immediately (not inside boot()) — beforeinstallprompt
     can fire within moments of page load, and Chrome does not re-fire
     or queue it for a listener attached late. Waiting on authGuard()
     and the initial data fetches was causing the event to be missed,
     so the install popup never appeared. */
  registerServiceWorker();
  initInstallPopup();

  boot();

})();
</script>
