name: Generate product pages

# Regenerates static /product/{slug}/ and /books/{slug}/ pages (with real
# OG/Twitter/JSON-LD meta tags baked in from Supabase) plus sitemap.xml,
# then commits the result back to main so GitHub Pages republishes it.
#
# This exists because WhatsApp/Facebook/Telegram/X/Discord crawlers
# don't execute JavaScript — the product meta tags must already be in
# the raw HTML for link previews and Google rich results to work.
#
# Fires on demand, immediately after a successful write to
# admin_products_catalog, via the Supabase Edge Function in
# supabase/functions/trigger-page-rebuild/ (called from
# admin/products-manager.js right after insert/update/delete).
# The cron schedule below is a safety net: that Edge Function call is
# best-effort and non-fatal (it must never block the admin's save), so
# this still runs every 2h to catch any product the on-demand trigger
# silently missed. `workflow_dispatch` is also available for a manual
# "Run workflow" click in the Actions tab.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'What triggered this run (e.g. "add product: <name>")'
        required: false
        default: 'manual'

permissions:
  contents: write

# Serializes ALL runs of this workflow — cron, workflow_dispatch (manual or
# from supabase/functions/trigger-page-rebuild/) alike — against each other:
# `group` is a workflow-level property, not a per-trigger one, so a cron tick
# and an on-demand dispatch both land in the same "generate-product-pages"
# group regardless of which fired them. `cancel-in-progress: true` is correct
# here because only the LATEST catalog state matters for this job — an
# in-progress older run's output would be superseded anyway. This already
# closes most of the race window between the two triggers; the retry loop
# below in "Commit and push" covers what's left (e.g. an unrelated commit
# landing on main between this job's checkout and its push).
concurrency:
  group: generate-product-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger reason
        run: 'echo "Triggered by: ${{ github.event.inputs.reason }}"'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate product pages + sitemap
        # No `|| true` — a generator failure must stop the job here. Bash
        # steps in Actions already run with `set -eo pipefail`, so a non-zero
        # exit (including the per-item-failure exitCode=1 case documented in
        # generate-product-pages.js) fails this step and the whole job right
        # away. Nothing downstream (validate/commit/push) executes.
        run: node scripts/generate-product-pages.js

      - name: Validate repository
        # Same reasoning: no `|| true`. A validation failure (e.g. a
        # malformed sitemap, a JS syntax error) must stop the job before
        # anything gets committed, let alone pushed.
        run: npm run validate

      - name: Commit and push (retries by regenerating against latest main)
        # Reached only if both steps above succeeded — there is no
        # `if: success() || failure()` here anymore, so a failed generate or
        # validate step means this step, and the job, never runs at all.
        # Nothing partially generated or unvalidated is ever committed.
        #
        # The retry loop below handles a *push* rejection specifically (main
        # moved under us between checkout and push — see the concurrency
        # comment above for why this window is now narrow but not provably
        # zero). It deliberately does NOT rebase or merge, and never touches
        # `--force`: each retry discards only this job's own not-yet-pushed
        # work (safe — see below) and produces a brand-new commit from a
        # fresh regenerate + re-validate against the new origin/main, which
        # is conflict-free by construction because the generator's output is
        # deterministic for a given catalog state (see
        # generate-product-pages.js). No "ours/theirs" choice is ever made.
        #
        # `git reset --hard origin/main` is safe ONLY because this runs
        # exclusively on a fresh, ephemeral GitHub-hosted runner checked out
        # by actions/checkout@v4 at the top of this same job: the working
        # tree can only ever contain (a) this run's own generated output, or
        # (b) a commit this same job made in an earlier loop iteration that
        # then failed to push. No human's uncommitted work can be present.
        # This step must never be copied into a workflow that might run
        # against a developer-controlled checkout.
        run: |
          git config user.name "derradj-shop-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product/ books/ Electronique/ subscriptions/ index.html books-data.js sitemap.xml scripts/.image-dims-cache.json
          if git diff --cached --quiet; then
            echo "No changes — products are already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate product pages + sitemap from Supabase"

          if git push; then
            echo "Pushed successfully (attempt 1/3)."
            exit 0
          fi

          for attempt in 2 3; do
            echo "::warning::push rejected on attempt $((attempt - 1))/3 — origin/main moved under us. Retrying: resetting to latest main and regenerating from scratch (attempt $attempt/3)..."
            git fetch origin main
            git reset --hard origin/main

            echo "Regenerating (attempt $attempt/3)..."
            node scripts/generate-product-pages.js

            echo "Validating (attempt $attempt/3)..."
            npm run validate

            git add product/ books/ Electronique/ subscriptions/ index.html books-data.js sitemap.xml scripts/.image-dims-cache.json
            if git diff --cached --quiet; then
              echo "No changes after regenerating against latest main — nothing to push."
              exit 0
            fi
            git commit -m "chore: regenerate product pages + sitemap from Supabase"

            if git push; then
              echo "Pushed successfully (attempt $attempt/3)."
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              echo "::error::push rejected after 3 attempts — origin/main kept moving under us each time. Failing the workflow; the next scheduled run (or a manual re-dispatch) will retry."
              exit 1
            fi
          done
